version: '3.9'

services:
  # MongoDB
  mongo_db:
    image: mongo:4.4.6
    restart: always
    volumes:
      - mongo_db:/data/db
    command: mongod --quiet --logpath /dev/null
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    ports:
      - 3010:3000
    volumes:
      - ./app:/home/poet/docker-pr/freshapp/app
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo_db:27017
      DBNAME: freshapp
    depends_on:
      mongo_db:
        condition: service_healthy
      
volumes:
  mongo_db: {}
